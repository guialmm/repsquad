name: CI

# Sem filtro de caminho de propósito: "api" e "mobile" são checks obrigatórios
# da main, e um check que não roda deixa o PR travado para sempre.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # Postgres de verdade para testar as migrações (os testes usam SQLite em memória).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: treinos
          POSTGRES_PASSWORD: treinos
          POSTGRES_DB: treinos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treinos -d treinos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://treinos:treinos@localhost:5432/treinos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Formatação (ruff format)
        run: uv run ruff format --check .
      - name: Testes (pytest)
        run: uv run pytest
      - name: Migrações no Postgres (sobe, desce e sobe de novo)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Seed no Postgres (com os dados de exemplo dos testes, 2x para provar que não duplica)
        run: |
          for i in 1 2; do
            uv run python -m app.seed.exercises --source tests/fixtures/exercises_sample.json --translations tests/fixtures/exercises_pt_br_sample.csv
          done
      - name: openapi.json está atualizado?
        run: |
          uv run python -m app.export_openapi
          git diff --exit-code openapi.json || (echo "::error::Rode 'uv run python -m app.export_openapi' e commite o openapi.json" && exit 1)

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: Tipos da API estão atualizados?
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || (echo "::error::Rode 'npm run gen:api' e commite o schema.d.ts" && exit 1)
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tipos (tsc)
        run: npm run typecheck
