services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: treinos
      POSTGRES_PASSWORD: treinos
      POSTGRES_DB: treinos
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treinos -d treinos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
